[package]
name = "stackmachine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Rust SDK for StackMachine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/stackmachine/sdks"
homepage = "https://github.com/stackmachine/sdks/tree/main/rust"
keywords = ["stackmachine", "sdk", "cloud", "deployment", "graphql"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "graphql/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
