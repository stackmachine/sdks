query srcGetSshAuthorizedKeysQuery(
  $id: ID!
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  node(id: $id) {
    ... on SshUser {
      authorizedKeys(first: $first, after: $after, last: $last, before: $before) {
        edges {
          cursor
          node {

id
name
publicKey
createdAt

          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          endCursor
          startCursor
        }
        totalCount
      }
    }
  }
}
