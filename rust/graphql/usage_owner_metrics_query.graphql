query srcUsageOwnerMetricsQuery(
  $owner: String!
  $start: DateTime!
  $end: DateTime!
  $groupedBy: MetricGrouping!
) {
  owner: getGlobalObject(slug: $owner) {
    __typename
    ... on Namespace {
      groupedMetrics(startAt: $start, endAt: $end, groupedBy: $groupedBy) {

startAt
endAt
grouped {
  groupedAt
  requests {
    cachedRequests
    dataCachedBytes
    dataServedBytes
    http2xx
    http3xx
    http4xx
    http5xx
    httpOther
    percentageCached
    requestDurationMillis
    totalRequests
    uniqueUsers
  }
  workloads {
    memoryBytes
    networkEgressBytes
    networkIngressBytes
    realCpuTimeMillis
    wallCpuTimeMillis
    workloads
  }
}
totals {
  requests {
    cachedRequests
    dataCachedBytes
    dataServedBytes
    http2xx
    http3xx
    http4xx
    http5xx
    httpOther
    percentageCached
    requestDurationMillis
    totalRequests
    uniqueUsers
  }
  workloads {
    memoryBytes
    networkEgressBytes
    networkIngressBytes
    realCpuTimeMillis
    wallCpuTimeMillis
    workloads
  }
}

      }
    }
    ... on User {
      groupedMetrics(startAt: $start, endAt: $end, groupedBy: $groupedBy) {

startAt
endAt
grouped {
  groupedAt
  requests {
    cachedRequests
    dataCachedBytes
    dataServedBytes
    http2xx
    http3xx
    http4xx
    http5xx
    httpOther
    percentageCached
    requestDurationMillis
    totalRequests
    uniqueUsers
  }
  workloads {
    memoryBytes
    networkEgressBytes
    networkIngressBytes
    realCpuTimeMillis
    wallCpuTimeMillis
    workloads
  }
}
totals {
  requests {
    cachedRequests
    dataCachedBytes
    dataServedBytes
    http2xx
    http3xx
    http4xx
    http5xx
    httpOther
    percentageCached
    requestDurationMillis
    totalRequests
    uniqueUsers
  }
  workloads {
    memoryBytes
