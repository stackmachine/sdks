name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_existing_version:
        description: Publish the package.json version already on main
        required: true
        default: false
        type: boolean
      publish_existing_python_version:
        description: Publish the pyproject.toml version already on main
        required: true
        default: false
        type: boolean
      publish_existing_rust_version:
        description: Publish the Cargo.toml version already on main
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      js_release_created: ${{ steps.release.outputs['js--release_created'] }}
      python_release_created: ${{ steps.release.outputs['python--release_created'] }}
      rust_release_created: ${{ steps.release.outputs['rust--release_created'] }}
      rust_release_sha: ${{ steps.release.outputs['rust--sha'] }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-js:
    if: ${{ github.event_name == 'push' && needs.release.outputs.js_release_created == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Check formatting
        run: npm run format:check
        working-directory: js

      - name: Type check
        run: npm run typecheck
        working-directory: js

      - name: Build package
        run: npm run build
        working-directory: js

      - name: Check schema
        run: npm run check-schema
        working-directory: js

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: js

      - name: Publish to npm
        run: npm publish
        working-directory: js

  publish-python:
    if: ${{ github.event_name == 'push' && needs.release.outputs.python_release_created == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev --python 3.12

      - name: Lint
        run: uv run --frozen ruff check src examples tests

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest

      - name: Build package
        run: uv build --no-sources

      - name: Verify package contents
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish

  publish-rust:
    # A manual retry must run even though the release job is skipped.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.release.outputs.rust_release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_existing_rust_version)) }}
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.rust_release_sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Test documentation
        run: cargo test --locked --doc

      - name: Verify package
        run: cargo publish --locked --dry-run

      - name: Check whether the version is already published
        id: registry
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stackmachine") | .version')
          response_file="$RUNNER_TEMP/stackmachine-crate-version.json"
          status=$(curl --silent --show-error --retry 3 \
            --connect-timeout 10 --max-time 30 \
            --user-agent 'stackmachine/sdks release workflow' \
            --output "$response_file" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/stackmachine/$crate_version")
          case "$status" in
            200)
              jq --exit-status --arg version "$crate_version" \
                '.version.crate == "stackmachine" and .version.num == $version' "$response_file" > /dev/null
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::stackmachine $crate_version is already published; skipping upload."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io version lookup returned HTTP $status"
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Check formatting
        run: npm run format:check
        working-directory: js

      - name: Type check
        run: npm run typecheck
        working-directory: js

      - name: Build package
        run: npm run build
        working-directory: js

      - name: Check schema
        run: npm run check-schema
        working-directory: js

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: js

      - name: Publish to npm
        run: npm publish
        working-directory: js

  publish-existing-python:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_python_version }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev --python 3.12

      - name: Lint
        run: uv run --frozen ruff check src examples tests

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest

      - name: Build package
        run: uv build --no-sources

      - name: Verify package contents
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish
